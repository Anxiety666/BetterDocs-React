<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elderwood — Bibliothèque du lore</title>
<meta name="description" content="Bibliothèque de lore et règlement du serveur RP Elderwood, école de magie.">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23161d19'/%3E%3Cpath d='M32 8l6 18 18 6-18 6-6 18-6-18-18-6 18-6z' fill='%23c2a15a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<script>
  /* thème appliqué avant le premier rendu (évite le flash) */
  (function () {
    var t = null;
    try { t = localStorage.getItem('ew-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>

<header class="topbar" role="banner">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Ouvrir le menu des sections" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
  </button>
  <a class="brand" href="#/" aria-label="Elderwood, accueil">
    <svg class="brand-mark" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><path d="M32 6l7 19 19 7-19 7-7 19-7-19-19-7 19-7z" fill="currentColor"/></svg>
    <span class="brand-text"><span class="brand-name">Elderwood</span><span class="brand-sub">Bibliothèque du lore</span></span>
  </a>

  <div class="search-box" role="search">
    <label for="q" class="sr-only">Rechercher dans tout le site</label>
    <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Rechercher…" title="Rechercher dans tout le site (raccourci : touche /)" autocomplete="off" spellcheck="false" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
    <div id="suggest" class="suggest" role="listbox" hidden></div>
  </div>

  <nav class="top-actions" aria-label="Outils">
    <a class="top-link" href="#/glossaire">Glossaire</a>
    <div class="mode" role="group" aria-label="Niveau d'accès affiché">
      <label for="modeSel" class="sr-only">Niveau d'accès affiché</label>
      <select id="modeSel" title="Niveau d'accès affiché"></select>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Basculer entre le mode clair et le mode sombre" title="Mode clair / sombre">
      <svg class="ico-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="printBtn" aria-label="Imprimer cette page" title="Imprimer">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4.5V9.5h15V17H17M7 14h10v7H7z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
    </button>
  </nav>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Sections">
    <nav id="sideNav"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main id="main" class="main" tabindex="-1">
    <div id="view"><p class="loading">Chargement…</p></div>
    <noscript><p class="notice">Ce site nécessite JavaScript pour afficher les documents.</p></noscript>
  </main>
</div>

<footer class="site-foot">
  <span id="footStats"></span>
  <span>Contenu issu des documents du pôle RP — <span id="footSnap"></span>. Les textes sont repris tels quels ; en cas de contradiction entre documents, le site ne tranche pas.</span>
</footer>

<div id="glTip" class="gl-tip" role="tooltip" hidden></div>

<script src="data/manifest.js"></script>
<script src="data/glossary.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
